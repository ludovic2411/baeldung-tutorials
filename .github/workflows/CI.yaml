name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment:
      name: CI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and run docker compose stack
        run: docker compose -f compose.ci.yaml up --build --abort-on-container-exit --exit-code-from spring-boot-application

      - name: Show logs on failure
        if: failure()
        run: docker compose -f compose.ci.yaml logs

      - name: Tear down
        if: always()
        run: docker compose -f compose.ci.yaml down -v